<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Akademik & BK</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Latar belakang pemandangan kota malam dengan efek gelap/ungu */
        .hero-bg {
            background: linear-gradient(rgba(15, 15, 30, 0.6), rgba(15, 15, 30, 0.8)), 
                        url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        /* Kotak Login Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="hero-bg d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row align-items-center justify-content-between">
            
            <!-- Bagian Kiri: Teks Sambutan Estetik -->
            <div class="col-lg-7 text-white mb-5 mb-lg-0 px-4">
                <h1 class="display-4 fw-bold mb-3">Sistem Terpadu<br>Wali Kelas & Guru BK</h1>
                <p class="lead text-light opacity-75 mb-4">
                    Kelola absensi harian siswa, pemantauan kedisiplinan, hingga arsip bimbingan konseling secara efisien, aman, dan terintegrasi.
                </p>
                <div class="d-flex gap-3">
                    <span class="badge bg-primary px-3 py-2 fs-6">Aman & Terenkripsi</span>
                    <span class="badge bg-secondary px-3 py-2 fs-6">Multi-Role Akses</span>
                </div>
            </div>

            <!-- Bagian Kanan: Form Login (Card Elegan) -->
            <div class="col-lg-4">
                <div class="glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Masuk Akun</h3>
                        <p class="text-muted small">Silakan pilih peran dan masukkan kode akses Anda.</p>
                    </div>

                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="role" class="form-label fw-semibold text-secondary small">Peran (Role)</label>
                            <select class="form-select" id="role" required>
                                <option value="" disabled selected>-- Pilih Peran --</option>
                                <option value="walas">Wali Kelas</option>
                                <option value="bk">Guru BK</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="kodeAkses" class="form-label fw-semibold text-secondary small">Kode Akses / Sandi</label>
                            <input type="password" class="form-control" id="kodeAkses" placeholder="Masukkan sandi..." required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Masuk ke Dashboard</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
