<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Layanan BK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-3">Login Layanan BK</h3>
        <p class="text-muted text-center small">Silakan pilih peran dan masukkan kode akses</p>
        
        <form id="formLogin">
            <div class="mb-3">
                <label for="role" class="form-label">Masuk Sebagai</label>
                <select class="form-select" id="role" required>
                    <option value="" disabled selected>Pilih Peran...</option>
                    <option value="walas">Wali Kelas</option>
                    <option value="bk">Guru BK</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="kodeAkses" class="form-label">Kode Akses / Password</label>
                <input type="password" class="form-control" id="kodeAkses" required placeholder="Masukkan password...">
                <div class="form-text">Petunjuk: Walas (walas123), BK (bk123)</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Masuk</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
