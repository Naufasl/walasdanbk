<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Materi - Guru BK</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <a class="navbar-brand" href="bk.html">Sistem BK - Guru BK</a>
        <div>
            <a href="bk.html" class="btn btn-outline-light btn-sm me-2">← Kembali ke Menu</a>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Keluar (Logout)</button>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 900px;">
        
        <!-- Tombol Kembali ke Dashboard -->
        <div class="mb-3">
            <a href="bk.html" class="btn btn-secondary btn-sm">&laquo; Kembali ke Dashboard</a>
        </div>

        <!-- Header Judul -->
        <div class="mb-4">
            <h2>Arsip Materi Bimbingan & Konseling</h2>
            <p class="text-muted">Kelola dan simpan arsip materi (Bullying, Karir, dll).</p>
        </div>

        <!-- Alert Notifikasi Berhasil (Awalnya Tersembunyi) -->
        <div id="alertSukses" class="alert alert-success text-center py-2 mb-3" style="display: none;">
            Materi baru berhasil disimpan!
        </div>

        <!-- Tombol Navigasi Tab (Tambah & Lihat Daftar) -->
        <div class="d-flex gap-2 mb-4">
            <button id="btnTabTambahMateri" class="btn btn-primary" onclick="tampilTabMateri('tambah')">+ Tambah Materi Baru</button>
            <button id="btnTabDaftarMateri" class="btn btn-outline-secondary" onclick="tampilTabMateri('daftar')">📋 Lihat Daftar Materi</button>
        </div>

        <!-- SECTION 1: Form Tambah Materi -->
        <div id="sectionTambahMateri" class="card shadow-sm p-4 mb-4">
            <h4 class="mb-3">Form Tambah Arsip Materi</h4>
            <form id="formMateri" onsubmit="simpanMateri(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Judul Materi:</label>
                    <input type="text" class="form-control" id="materiJudul" placeholder="Contoh: Pencegahan Bullying di Lingkungan Sekolah..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Deskripsi:</label>
                    <textarea class="form-control" id="materiDeskripsi" rows="4" placeholder="Tuliskan ringkasan atau detail isi materi..." required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Status Materi:</label>
                    <select class="form-select" id="materiStatus">
                        <option value="Sudah Disampaikan">Sudah Disampaikan</option>
                        <option value="Belum Disampaikan">Belum Disampaikan</option>
                        <option value="Draft">Draft</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary px-4">Simpan Materi</button>
            </form>
        </div>

        <!-- SECTION 2: Daftar Materi Tersimpan (Awalnya Tersembunyi) -->
        <div id="sectionDaftarMateri" class="card shadow-sm p-4 mb-4" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Daftar Arsip Materi BK</h4>
                <button class="btn btn-outline-danger btn-sm" onclick="hapusSemuaMateri()">🗑️ Hapus Semua Materi</button>
            </div>
            <div id="wadahDaftarMateri" class="d-flex flex-column gap-3">
                <!-- Data materi akan dimuat di sini secara berbaris ke bawah -->
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
